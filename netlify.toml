[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/api/analyze"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze-batch"
  to = "/.netlify/functions/api/analyze-batch"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/history"
  to = "/.netlify/functions/api/history"
  status = 200
  force = true

[[redirects]]
  from = "/api/export-html"
  to = "/.netlify/functions/api/export-html"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
